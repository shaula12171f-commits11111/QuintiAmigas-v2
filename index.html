<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuintiAmigas v2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0f1a, #1a1a2e 50%, #16213e);
      color: #e8e6ff;
      min-height: 100vh;
      padding: 16px;
    }
    .wrap { max-width: 820px; margin: 0 auto; }
    h1 { text-align: center; margin: 12px 0 20px; color: #c4b5fd; }
    .grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 20px; }
    .card {
      width: 120px; cursor: pointer; border: 3px solid #8b5cf6; border-radius: 14px;
      overflow: hidden; background: #1a1a2e; transition: 0.2s;
    }
    .card:hover, .card.active { border-color: #e9d5ff; transform: translateY(-3px); box-shadow: 0 0 18px #8b5cf688; }
    .card img { width: 100%; height: 140px; object-fit: cover; display: block; background: #222; }
    .card span { display: block; text-align: center; padding: 8px; font-weight: 700; font-size: 14px; }
    .card small { display: block; text-align: center; padding: 0 6px 8px; font-size: 10px; color: #a78bfa; line-height: 1.2; }
    .panel {
      background: rgba(20,20,35,0.95); border: 2px solid #8b5cf655; border-radius: 16px; padding: 16px;
    }
    #meta { font-size: 13px; color: #a78bfa; margin-bottom: 10px; }
    #msgs {
      height: 420px; overflow-y: auto; background: #0f0f1a; border-radius: 12px;
      padding: 14px; border: 1px solid #8b5cf644; margin-bottom: 12px;
    }
    .msg { margin: 10px 0; padding: 12px 14px; border-radius: 12px; max-width: 90%; line-height: 1.45; white-space: pre-wrap; }
    .user { margin-left: auto; background: #1e3a5f; }
    .bot { background: #2d1b4e; }
    .bot img { max-width: 280px; border-radius: 10px; margin-top: 8px; display: block; }
    .bot .cap { font-size: 11px; color: #c4b5fd; margin-top: 4px; }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1; padding: 12px 16px; border-radius: 24px; border: 2px solid #8b5cf6;
      background: #1a1a2e; color: #fff; font-size: 16px; outline: none;
    }
    button {
      padding: 12px 18px; border: none; border-radius: 24px; font-weight: 700; cursor: pointer;
      background: linear-gradient(135deg, #667eea, #8b5cf6); color: white;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { font-size: 12px; color: #9ca3af; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>QuintiAmigas v2</h1>
    <div class="grid" id="selector"></div>
    <div class="panel">
      <div id="meta">Cargando imágenes...</div>
      <div id="msgs"></div>
      <div class="row">
        <input id="input" placeholder="Escribe algo..." disabled />
        <button id="send" disabled>Enviar</button>
        <button id="reset" type="button">Reset</button>
      </div>
      <p class="hint">Usuario = siempre hombre · Progresión realista · Pack de imágenes original</p>
    </div>
  </div>

  <script type="module">
    import { setChica, enviarMensaje, resetChat, getEstado, getChicasDisponibles } from './src/core/logica.js';
    import { ensureImagenesLoaded, getImagenSelector, getDescripcionChica } from './src/systems/imagenes.js';

    const selector = document.getElementById('selector');
    const msgs = document.getElementById('msgs');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const meta = document.getElementById('meta');
    let busy = false;

    await ensureImagenesLoaded();
    meta.textContent = 'Elige una chica para empezar';

    for (const nombre of getChicasDisponibles()) {
      const div = document.createElement('div');
      div.className = 'card';
      const img = getImagenSelector(nombre);
      const desc = getDescripcionChica(nombre);
      div.innerHTML = `<img src="${img}" alt="${nombre}"><span>${nombre}</span><small>${desc}</small>`;
      div.onclick = () => {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        div.classList.add('active');
        setChica(nombre);
        msgs.innerHTML = '';
        input.disabled = false;
        sendBtn.disabled = false;
        meta.textContent = `${nombre} · ${desc} · fase: normal`;
        input.focus();
      };
      selector.appendChild(div);
    }

    function addMsg(text, who, imgUrl, audioUrl, cap) {
      const el = document.createElement('div');
      el.className = 'msg ' + who;
      const html = text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*([^*]+)\*/g, '<em style="color:#fbbf24">*$1*</em>');
      el.innerHTML = html;
      if (imgUrl && who === 'bot') {
        const im = document.createElement('img');
        im.src = imgUrl;
        im.alt = 'escena';
        el.appendChild(im);
        if (cap) {
          const c = document.createElement('div');
          c.className = 'cap';
          c.textContent = cap;
          el.appendChild(c);
        }
      }
      if (audioUrl && who === 'bot') {
        const au = document.createElement('audio');
        au.controls = true;
        au.src = audioUrl;
        au.style.display = 'block';
        au.style.marginTop = '6px';
        au.style.maxWidth = '280px';
        el.appendChild(au);
        au.play().catch(() => {});
      }
      msgs.appendChild(el);
      msgs.scrollTop = msgs.scrollHeight;
    }

    async function send() {
      const text = input.value.trim();
      if (!text || busy) return;
      busy = true;
      sendBtn.disabled = true;
      input.value = '';
      addMsg(text, 'user');
      try {
        const r = await enviarMensaje(text);
        addMsg(r.texto, 'bot', r.imagenUrl, r.audioUrl, r.descripcionImg);
        meta.textContent = `${r.chica} · fase: ${r.fase}`;
      } catch (e) {
        addMsg('Error: ' + e.message, 'bot');
      } finally {
        busy = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.onclick = send;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    document.getElementById('reset').onclick = () => {
      resetChat();
      msgs.innerHTML = '';
      const st = getEstado();
      meta.textContent = st.chica ? `${st.chica} · fase: ${st.fase}` : 'Elige una chica';
    };
  </script>
</body>
</html>
